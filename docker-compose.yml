services:
  db:
    image: postgres:16
    container_name: photo-cloud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: photo_cloud_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photo-cloud-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/photo_cloud_app
      NEXTAUTH_SECRET: super-secret-dev-key
      NEXTAUTH_URL: http://localhost:3000
      SUPABASE_URL: your-supabase-url
      SUPABASE_ANON_KEY: your-supabase-anon-key
      SUPABASE_SERVICE_ROLE_KEY: your-supabase-service-role-key
      SUPABASE_STORAGE_BUCKET: event-photos
    depends_on:
      - db

volumes:
  postgres_data:
